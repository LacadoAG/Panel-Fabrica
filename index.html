<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<style>

body{
    margin:0;
    background:black;
}

#slide{
    width:100vw;
    height:100vh;
    object-fit:contain;
}

</style>

</head>

<body>

<img id="slide">

<script>

let imagenes=[];
let actual=0;

fetch("slides.json")
.then(r=>r.json())
.then(data=>{

    imagenes=data.imagenes;

    mostrar();

    setInterval(()=>{

        actual++;

        if(actual>=imagenes.length){
            actual=0;
        }

        mostrar();

    },15000);

});

function mostrar(){

    document.getElementById("slide").src=
        imagenes[actual];

}

</script>

</body>

</html>
