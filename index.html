<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="utf-8">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<!-- Recarga completa cada 5 minutos -->
<meta http-equiv="refresh" content="300">

<title>Panel Fábrica</title>

<style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
}

#slide,
#web,
#video{
    width:100vw;
    height:100vh;
    border:none;
    display:none;
    background:black;
}

#slide{
    object-fit:contain;
}

#video{
    object-fit:contain;
}

#reloj{
    position:absolute;
    top:15px;
    right:25px;
    z-index:1000;

    color:white;
    background:rgba(0,0,0,0.4);

    padding:10px 20px;
    border-radius:8px;

    font-size:32px;
    font-weight:bold;

    text-align:right;

    text-shadow:
        2px 2px 4px rgba(0,0,0,1);
}

</style>

</head>

<body>

<div id="reloj"></div>

<img id="slide">

<iframe id="web"></iframe>

<video
    id="video"
    muted
    autoplay
    playsinline>
</video>

<script>

let slides = [];
let actual = 0;
let temporizador = null;

function actualizarReloj(){

    const ahora = new Date();

    const fecha = ahora.toLocaleDateString("es-ES");

    const hora = ahora.toLocaleTimeString(
        "es-ES",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

    document.getElementById("reloj").innerHTML =
        fecha + "<br>" + hora;
}

actualizarReloj();
setInterval(actualizarReloj,1000);

async function cargarSlides(){

    try{

        const respuesta =
            await fetch("slides.json?t=" + Date.now());

        const datos =
            await respuesta.json();

        slides = datos;

        if(actual >= slides.length){
            actual = 0;
        }

    }
    catch(error){

        console.error(
            "Error cargando slides.json",
            error
        );

    }

}

function siguienteSlide(){

    actual++;

    if(actual >= slides.length){
        actual = 0;
    }

    mostrar();
}

async function mostrar(){

    if(slides.length === 0){
        return;
    }

    if(temporizador){
        clearTimeout(temporizador);
    }

    const item = slides[actual];

    const img =
        document.getElementById("slide");

    const web =
        document.getElementById("web");

    const video =
        document.getElementById("video");

    img.style.display = "none";
    web.style.display = "none";
    video.style.display = "none";

    video.pause();
    video.onended = null;
    video.onerror = null;

    if(item.tipo === "imagen"){

        img.src =
            item.url + "?t=" + Date.now();

        img.style.display = "block";

        temporizador = setTimeout(
            siguienteSlide,
            item.duracion || 15000
        );
    }

    else if(item.tipo === "web"){

        web.src = item.url;

        web.style.display = "block";

        temporizador = setTimeout(
            siguienteSlide,
            item.duracion || 30000
        );
    }

    else if(item.tipo === "video"){

        video.src =
            item.url + "?t=" + Date.now();

        video.style.display = "block";

        video.load();

        video.play().catch(() => {});

        video.onended = () => {
            siguienteSlide();
        };

        video.onerror = () => {
            siguienteSlide();
        };
    }

}

async function iniciar(){

    await cargarSlides();

    mostrar();

    setInterval(async ()=>{

        await cargarSlides();

    },60000);

}

iniciar();

</script>

</body>

</html>
