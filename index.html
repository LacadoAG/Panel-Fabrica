<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<style>

body{
    margin:0;
    background:black;
}

#slide{
    width:100vw;
    height:100vh;
    object-fit:contain;
}

</style>

</head>

<body>

<img id="slide">

<script>

let slides=[];
let actual=0;

fetch("slides.json")
.then(r=>r.json())
.then(data=>{

    slides=data;

    mostrar();

});

function mostrar(){

    document.getElementById("slide").src =
        slides[actual].url;

    setTimeout(() => {

        actual++;

        if(actual >= slides.length){
            actual = 0;
        }

        mostrar();

    }, slides[actual].duracion);

}

</script>

</body>

</html>
