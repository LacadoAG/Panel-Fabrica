<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<style>

body{
    margin:0;
    background:black;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

#contenido{
    width:100vw;
    height:100vh;
}

img, video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:black;
}

#reloj{
    position:fixed;
    top:10px;
    right:20px;
    color:white;
    font-size:32px;
    font-weight:bold;
    background:rgba(0,0,0,0.5);
    padding:10px 20px;
    border-radius:10px;
    z-index:1000;
}

</style>

</head>

<body>

<div id="reloj"></div>

<div id="contenido"></div>

<script>

let slides = [];
let actual = 0;

function actualizarReloj(){

    const ahora = new Date();

    const fecha =
        ahora.toLocaleDateString("es-ES");

    const hora =
        ahora.toLocaleTimeString("es-ES");

    document.getElementById("reloj").innerHTML =
        fecha + "<br>" + hora;
}

setInterval(actualizarReloj,1000);
actualizarReloj();

fetch("slides.json")
.then(r=>r.json())
.then(data=>{

    slides = data;

    mostrarSlide();

});

function mostrarSlide(){

    let slide = slides[actual];

    let contenedor =
        document.getElementById("contenido");

    contenedor.innerHTML="";

    if(slide.tipo==="imagen"){

        let img=document.createElement("img");
        img.src=slide.url;
        contenedor.appendChild(img);

    }

    if(slide.tipo==="video"){

        let video=document.createElement("video");

        video.src=slide.url;
        video.autoplay=true;
        video.muted=true;
        video.loop=true;

        contenedor.appendChild(video);

    }

    setTimeout(()=>{

        actual++;

        if(actual>=slides.length){
            actual=0;
        }

        mostrarSlide();

    },slide.duracion);

}

</script>

</body>

</html>
